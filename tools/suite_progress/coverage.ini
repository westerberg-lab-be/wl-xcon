# The map's coverage run (`tools/mutate.py --build-map`; CI-time design §4.1).
# Read by coverage.py 7.17.4 as of 2026-11-21; each line's source is cited beside it.
[run]
# Written out although it is 3.13's default: "the sysmon core does not yet support
# plugins, dynamic contexts..." (coverage config page, read 2026-11-21), and the map is
# dynamic contexts. Pinned so a later Python cannot change it.
core = ctrace
# Only the package is measured. Relative to the suite's working directory, so a toy
# tree in a test measures its own `wl_xcon/`.
source = wl_xcon
# Measures the Python children a test starts (new in 7.10). It also turns `parallel`
# on (`config.py:574`); written out below anyway, because a child started through
# `COVERAGE_PROCESS_START` needs it and the subprocess page says so: "You will also need
# the parallel option to collect separate data for each process" (read 2026-11-21).
patch = subprocess
parallel = true
# The running test's node id, set by `wlx_suite_progress` while a test runs and absent
# otherwise (`${VAR-default}`: `misc.py:substitute_variables`, applied to every value at
# `config.py:111`). A child re-reads this file, so it fills it in from its own environment.
context = ${WLX_COV_CONTEXT-}
